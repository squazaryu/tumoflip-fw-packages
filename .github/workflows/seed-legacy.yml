name: Seed immutable legacy heads

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SEED-stable001-dev008
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fw-packages-seed
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "SEED-stable001-dev008"
      - name: Check out control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove exact default-branch control commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download and verify exact legacy bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/seed_legacy.py --root . --output seed
          python3 tools/verify_catalog.py seed --root seed --contract-root .
          python3 tools/render_migration_provenance.py \
            --seed seed \
            --publisher-repository "$GITHUB_REPOSITORY" \
            --publisher-commit "$GITHUB_SHA"
          python3 tools/verify_catalog.py migration \
            --root seed --contract-root . \
            --publisher-repository "$GITHUB_REPOSITORY" \
            --publisher-commit "$GITHUB_SHA"
      - name: Upload verified seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-legacy-seed
          path: seed
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download verified seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-legacy-seed
          path: seed
      - name: Check out verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove exact default-branch publisher commit
        working-directory: control
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Reverify after job boundary
        env:
          PUBLISHER_REPOSITORY: ${{ github.repository }}
          PUBLISHER_COMMIT: ${{ github.sha }}
        run: |
          python3 control/tools/verify_catalog.py seed --root seed --contract-root control
          python3 control/tools/verify_catalog.py migration \
            --root seed --contract-root control \
            --publisher-repository "$PUBLISHER_REPOSITORY" \
            --publisher-commit "$PUBLISHER_COMMIT"
      - name: Publish immutable mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 control/tools/publish_seed.py \
            --seed seed --contract-root control \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-commit "$GITHUB_SHA"
