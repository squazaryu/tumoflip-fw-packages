name: Watch ARF and ProtoPirate sources

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-source-matrix
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove exact control checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run exact source matrix watcher
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python3 tools/watch_sources.py scan \
            --contract contracts/source-watchers.json \
            --output "$RUNNER_TEMP/source-matrix.json" \
            --markdown "$RUNNER_TEMP/source-matrix.md"
          status=$?
          set -e
          [[ "$status" == 0 || "$status" == 1 ]]
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload source matrix report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protected-source-matrix
          path: |
            ${{ runner.temp }}/source-matrix.json
            ${{ runner.temp }}/source-matrix.md
          if-no-files-found: error
          retention-days: 14

      - name: Reconcile review findings without repeated failure alerts
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_EXIT: ${{ steps.scan.outputs.status }}
        run: |
          set -euo pipefail
          python3 tools/audit_notifications.py \
            --mode source \
            --scan-exit "$SCAN_EXIT" \
            --report "$RUNNER_TEMP/source-matrix.json" \
            --markdown "$RUNNER_TEMP/source-matrix.md"
