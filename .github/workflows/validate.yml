name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned resource decoder
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes \
            -r tools/tumoflip/protected_audit_build_requirements.txt
          python3 -m pip install --disable-pip-version-check --no-deps \
            --no-build-isolation --require-hashes \
            -r tools/tumoflip/protected_audit_requirements.txt
      - name: Validate contracts and tests
        run: |
          python3 tools/verify_catalog.py contract --root .
          python3 -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python3 -m compileall -q tools tests
