name: Maintain independent FW Packages catalog index

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/current-releases.json"
      - "catalog-index.json"
      - "tools/catalog_index.py"
      - "schemas/catalog-index-v1.schema.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-index
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate and merge current release heads into history
        run: |
          set -euo pipefail
          python3 tools/catalog_index.py build \
            --current contracts/current-releases.json \
            --existing catalog-index.json \
            --output catalog-index.json
          python3 tools/catalog_index.py validate --index catalog-index.json
          python3 tools/verify_catalog.py contract --root .

      - name: Check whether catalog history changed
        id: catalog-diff
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "catalog index is current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "catalog index changed"
          fi

      - name: Create repository-scoped catalog PR token
        id: publisher-token
        if: github.event_name != 'pull_request' && steps.catalog-diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROTECTED_AUDIT_APP_ID }}
          private-key: ${{ secrets.PROTECTED_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open one catalog-index PR when history changed
        if: github.event_name != 'pull_request' && steps.catalog-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/catalog-index-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add catalog-index.json
          git commit -m "chore(catalog): reconcile immutable package history"
          git push --set-upstream origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base main \
            --title "chore(catalog): reconcile immutable package history" \
            --body "Automated catalog reconciliation. This PR updates only catalog-index.json; immutable releases and firmware labels are untouched."
